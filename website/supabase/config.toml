project_id = "side-quest-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation emails went to the local fake inbox (local_smtp, port 54324),
# not the tester's real address, so a just-created account could never sign
# in without someone thinking to check that inbox. Disabled to match the
# hosted project's setting and remove that friction; local dev accounts are
# synthetic anyway, so skipping confirmation costs nothing here.
enable_confirmations = false

# Google sign-in. The client secret is never written to this file — it's
# read from the GOOGLE_CLIENT_SECRET environment variable at `supabase
# start` time. See docs/SETUP.md for how to provide it locally. The hosted
# project is configured separately, straight in the Supabase dashboard
# (Authentication -> Providers -> Google), not through this file.
[auth.external.google]
enabled = true
client_id = "1021736894793-d0bs5ss8sj8ivhgcbdips78ajndkp93j.apps.googleusercontent.com"
secret = "env(GOOGLE_CLIENT_SECRET)"

# Local-only telemetry stack (Logflare/Vector). Disabled: it adds a flaky
# health check to local startup and is not needed for CP3 review; the
# services this project actually depends on (db, auth, rest, storage) do
# not require it.
[analytics]
enabled = false
