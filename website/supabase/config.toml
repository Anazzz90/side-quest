project_id = "side-quest-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Local-only telemetry stack (Logflare/Vector). Disabled: it adds a flaky
# health check to local startup and is not needed for CP3 review; the
# services this project actually depends on (db, auth, rest, storage) do
# not require it.
[analytics]
enabled = false
